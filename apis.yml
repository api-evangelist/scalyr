name: Scalyr
description: Scalyr was a cloud log management, server monitoring, and observability
  platform for engineering, DevOps, and security teams, known for an index-free,
  columnar architecture delivering sub-second queries across hundreds of terabytes
  of structured and unstructured log data. Founded in 2011, Scalyr was acquired by
  SentinelOne in 2021 and rebranded as DataSet; the scalyr.com domain now redirects
  to dataset.com. Its REST API (hosted at app.scalyr.com) covered log ingestion
  (addEvents), querying, and account/file management via API-key authentication.
  This profile was surfaced as a portfolio company of bloomberg-beta, gv, and
  susa-ventures and enriched by the API Evangelist pipeline.
